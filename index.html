<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small, accessible tip calculator — split the bill and tip live."
    />
    <title>SplitTip — Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <p class="brand__mark">SplitTip</p>
        <h1 class="brand__headline">Split the bill without the mental math.</h1>
        <p class="brand__lede">
          Enter the bill, pick a tip, and see everyone’s share update as you type.
        </p>
      </header>

      <main class="app" id="main">
        <form class="panel" id="tip-form" novalidate>
          <div class="field">
            <label for="bill">Bill amount</label>
            <div class="field__control field__control--prefix">
              <span class="field__prefix" aria-hidden="true">$</span>
              <input
                id="bill"
                name="bill"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="0.00"
                autocomplete="off"
              />
            </div>
          </div>

          <fieldset class="field field--tip">
            <legend>Tip percentage</legend>
            <div
              class="tip-presets"
              id="tip-presets"
              role="group"
              aria-label="Tip percentage presets"
            >
              <button type="button" class="tip-btn" data-tip="10" aria-pressed="false">
                10%
              </button>
              <button type="button" class="tip-btn is-active" data-tip="15" aria-pressed="true">
                15%
              </button>
              <button type="button" class="tip-btn" data-tip="18" aria-pressed="false">
                18%
              </button>
              <button type="button" class="tip-btn" data-tip="20" aria-pressed="false">
                20%
              </button>
              <button type="button" class="tip-btn" data-tip="25" aria-pressed="false">
                25%
              </button>
            </div>
            <div class="field__control field__control--suffix">
              <label class="visually-hidden" for="custom-tip">Custom tip percentage</label>
              <input
                id="custom-tip"
                name="custom-tip"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="Custom"
                autocomplete="off"
              />
              <span class="field__suffix" aria-hidden="true">%</span>
            </div>
          </fieldset>

          <div class="field">
            <label for="people">Number of people</label>
            <input
              id="people"
              name="people"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              value="1"
              autocomplete="off"
            />
          </div>

          <p
            class="error"
            id="form-error"
            role="alert"
            hidden
          ></p>

          <div class="actions">
            <button type="button" class="btn btn--ghost" id="reset-btn">
              Reset
            </button>
          </div>
        </form>

        <section
          class="results"
          aria-labelledby="results-heading"
          aria-live="polite"
          aria-atomic="true"
        >
          <h2 id="results-heading" class="results__title">Your split</h2>
          <dl class="results__grid">
            <div class="results__item">
              <dt>Tip amount</dt>
              <dd id="tip-amount">$0.00</dd>
            </div>
            <div class="results__item">
              <dt>Total</dt>
              <dd id="total">$0.00</dd>
            </div>
            <div class="results__item">
              <dt>Tip / person</dt>
              <dd id="tip-per-person">$0.00</dd>
            </div>
            <div class="results__item results__item--emphasis">
              <dt>Total / person</dt>
              <dd id="total-per-person">$0.00</dd>
            </div>
          </dl>
        </section>
      </main>

      <footer class="footer">
        <p>
          <a href="tests.html">Run tests</a>
        </p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
